<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEV Creative Workbench · 跨境电商素材评分分类工作台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <!-- ============ 全局顶栏：品牌 · 搜索 · 统计胶囊 · 操作 ============ -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">JEV</div>
      <div class="brand-text">
        <h1>Creative&nbsp;Workbench</h1>
        <span>跨境电商素材 · AI 评分审片</span>
      </div>
    </div>

    <div class="topsearch">
      <span class="topsearch-ico">⌕</span>
      <input id="searchBox" class="input" placeholder="搜索素材名称 / 标签 / 痛点…">
      <kbd class="topsearch-kbd">/</kbd>
    </div>

    <div class="stats" id="globalStats">
      <div class="stat"><b id="statTotal">0</b><span>素材</span></div>
      <div class="stat"><b id="statAvg">--</b><span>均分</span></div>
      <div class="stat"><b id="statTop">0</b><span>S/A</span></div>
      <div class="stat risk"><b id="statRisk">0</b><span>风险</span></div>
      <div class="stat"><b id="statGo">0</b><span>可投</span></div>
    </div>

    <div class="top-actions">
      <button class="btn ai" id="btnAIAll">✦ AI 审核</button>
      <button class="btn ghost" id="btnExport">导出</button>
      <button class="btn ghost" id="btnModel">评分模型</button>
      <button class="btn primary" id="btnAdd">+ 导入素材</button>
    </div>
  </header>

  <!-- ============ 主布局 ============ -->
  <div class="layout">
    <!-- 左侧筛选面板：智能筛选指挥台（可折叠） -->
    <aside class="fpanel" id="fpanel">
      <div class="fpanel-head">
        <div class="fp-title">
          <span class="fp-ico">◧</span>
          <div class="fp-title-text">
            <b>筛选指挥台</b>
            <small>FILTER CONSOLE</small>
          </div>
        </div>
        <button class="tcloud-clear" id="fClear">重置</button>
      </div>

      <!-- 场景快捷筛片：运营工作流一键入口 -->
      <div class="fp-scenes">
        <div class="fp-scene" data-preset="todo" onclick="applyPreset('todo')">
          <span class="fp-scene-ico">⏳</span>
          <div class="fp-scene-meta"><b>待审优先</b><small>未过审素材</small></div>
          <em class="fp-scene-n" id="psTodo">0</em>
        </div>
        <div class="fp-scene" data-preset="risk" onclick="applyPreset('risk')">
          <span class="fp-scene-ico">⚠</span>
          <div class="fp-scene-meta"><b>合规风险</b><small>命中违规项</small></div>
          <em class="fp-scene-n" id="psRisk">0</em>
        </div>
        <div class="fp-scene" data-preset="top" onclick="applyPreset('top')">
          <span class="fp-scene-ico">★</span>
          <div class="fp-scene-meta"><b>S/A 高分</b><small>头部素材</small></div>
          <em class="fp-scene-n" id="psTop">0</em>
        </div>
        <div class="fp-scene" data-preset="goable" onclick="applyPreset('goable')">
          <span class="fp-scene-ico">✓</span>
          <div class="fp-scene-meta"><b>全渠道可投</b><small>三平台 GO</small></div>
          <em class="fp-scene-n" id="psGo">0</em>
        </div>
      </div>

      <!-- 手风琴筛选组 -->
      <div class="facc">
        <div class="acc">
          <button class="acc-head" type="button" onclick="toggleAcc(this)">
            <span class="acc-title">评级</span><span class="acc-badge" id="gBadgeGrades"></span><span class="acc-arrow">▾</span>
          </button>
          <div class="acc-body"><div class="acc-body-inner"><div class="chips" id="fGrades"></div></div></div>
        </div>

        <div class="acc">
          <button class="acc-head" type="button" onclick="toggleAcc(this)">
            <span class="acc-title">审片状态</span><span class="acc-badge" id="gBadgeReview"></span><span class="acc-arrow">▾</span>
          </button>
          <div class="acc-body"><div class="acc-body-inner"><div class="chips" id="fReview"></div></div></div>
        </div>

        <div class="acc">
          <button class="acc-head" type="button" onclick="toggleAcc(this)">
            <span class="acc-title">得分区间</span><span class="acc-badge" id="gBadgeScore"></span><span class="acc-arrow">▾</span>
          </button>
          <div class="acc-body"><div class="acc-body-inner">
            <div class="range-inputs">
              <input id="fMin" type="number" min="0" max="100" placeholder="0">
              <span>—</span>
              <input id="fMax" type="number" min="0" max="100" placeholder="100">
            </div>
          </div></div>
        </div>

        <div class="acc closed">
          <button class="acc-head" type="button" onclick="toggleAcc(this)">
            <span class="acc-title">品类</span><span class="acc-badge" id="gBadgeCats"></span><span class="acc-arrow">▾</span>
          </button>
          <div class="acc-body"><div class="acc-body-inner"><div class="checks scroll" id="fCats" style="max-height:150px"></div></div></div>
        </div>

        <div class="acc closed">
          <button class="acc-head" type="button" onclick="toggleAcc(this)">
            <span class="acc-title">素材类型</span><span class="acc-badge" id="gBadgeMedia"></span><span class="acc-arrow">▾</span>
          </button>
          <div class="acc-body"><div class="acc-body-inner"><div class="checks" id="fMedia"></div></div></div>
        </div>

        <div class="acc closed">
          <button class="acc-head" type="button" onclick="toggleAcc(this)">
            <span class="acc-title">渠道可投</span><span class="acc-badge" id="gBadgeChannels"></span><span class="acc-arrow">▾</span>
          </button>
          <div class="acc-body"><div class="acc-body-inner"><div class="checks" id="fChannels"></div></div></div>
        </div>

        <div class="acc">
          <button class="acc-head" type="button" onclick="toggleAcc(this)">
            <span class="acc-title">仅看风险</span><span class="acc-badge" id="gBadgeRisk"></span><span class="acc-arrow">▾</span>
          </button>
          <div class="acc-body"><div class="acc-body-inner">
            <label class="check-row"><input type="checkbox" id="fRiskOnly" style="width:auto"><span class="cr-label">只显示命中合规风险的素材</span></label>
          </div></div>
        </div>

        <div class="acc closed">
          <button class="acc-head" type="button" onclick="toggleAcc(this)">
            <span class="acc-title">出镜类型</span><span class="acc-badge" id="gBadgeActors"></span><span class="acc-arrow">▾</span>
          </button>
          <div class="acc-body"><div class="acc-body-inner"><div class="checks" id="fActors"></div></div></div>
        </div>

        <div class="acc closed">
          <button class="acc-head" type="button" onclick="toggleAcc(this)">
            <span class="acc-title">Hook 类型</span><span class="acc-badge" id="gBadgeHooks"></span><span class="acc-arrow">▾</span>
          </button>
          <div class="acc-body"><div class="acc-body-inner"><div class="checks scroll" id="fHooks"></div></div></div>
        </div>

        <div class="acc closed">
          <button class="acc-head" type="button" onclick="toggleAcc(this)">
            <span class="acc-title">标签</span><span class="acc-badge" id="gBadgeTags"></span><span class="acc-arrow">▾</span>
          </button>
          <div class="acc-body"><div class="acc-body-inner"><div class="checks scroll tags" id="fTags"></div></div></div>
        </div>
      </div>

      <!-- 底部命中仪表 -->
      <div class="fpanel-foot">
        <div class="fp-meter"><div class="fp-meter-bar" id="fMeterBar"></div></div>
        <div class="fp-meta">
          <span class="fp-meta-n">命中 <b id="fMeterCount">0</b>/<b id="fMeterTotal">0</b></span>
          <span class="fp-meta-s" id="fSummary">显示全部素材</span>
        </div>
      </div>
    </aside>

    <!-- 右侧工作区 -->
    <div class="maincol">
      <section class="results-bar">
        <button class="btn fpanel-toggle" id="btnToggleFilter" title="收起/展开筛选面板">☰</button>
        <div class="hitinfo">命中 <b id="hitCount">0</b> / <b id="totalCount">0</b></div>
        <div class="viewtabs">
          <button class="vtab active" data-view="grid" onclick="setView('grid')">素材墙</button>
          <button class="vtab" data-view="review" onclick="setView('review')">审片扫描</button>
          <button class="vtab" data-view="cats" onclick="setView('cats')">分类状态</button>
          <button class="vtab" data-view="kanban" onclick="setView('kanban')">分类看板</button>
          <select id="boardBy" class="select boardby hidden" onchange="setBoardBy(this.value)">
            <option value="grade">按评级 S/A/B/C/D</option>
            <option value="channel">按投放渠道</option>
            <option value="hook">按 Hook 类型</option>
          </select>
        </div>
        <select id="sortBy" class="select">
          <option value="composite-desc">综合分 高→低</option>
          <option value="composite-asc">综合分 低→高</option>
          <option value="updated-desc">最新更新</option>
          <option value="name-asc">名称 A→Z</option>
        </select>
      </section>

      <main id="grid" class="grid"></main>
      <main id="review" class="review hidden"></main>
      <main id="cats" class="catsview hidden"></main>
      <main id="kanban" class="kanban hidden"></main>
      <div id="empty" class="empty hidden">
        <div class="empty-icon">🔍</div>
        <p id="emptyText">没有符合条件的素材</p>
        <p class="muted">试试调整左侧筛选条件，或点击右上角「导入素材」建立素材库</p>
      </div>
    </div>
  </div>
</div>

<!-- 详情工作室 -->
<div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
<aside id="drawer" class="drawer hidden"></aside>

<!-- 导入弹窗 -->
<div id="modalBackdrop" class="modal-backdrop hidden"></div>
<div id="modal" class="modal hidden"></div>

<!-- 评分模型弹窗 -->
<div id="modelModalBackdrop" class="modal-backdrop hidden"></div>
<div id="modelModal" class="modal model-modal hidden"></div>

<!-- AI 审核弹窗 -->
<div id="aiModalBackdrop" class="modal-backdrop hidden"></div>
<div id="aiModal" class="modal ai-modal hidden"></div>

<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
